  desc: Get the points that draw a message or an image before hiding them
  contents:
  - surreal_text_points
  - surreal_image_points

- title: How It Works
  desc: Watch the method find its data
  contents:
  - surreal_trace
  - plot.surreal_trace

- title: Variable Selection
  desc: Hide the image among decoy predictors and select the real ones step by step
  contents:
  - surreal_decoys
  - surreal_path
  - plot.surreal_path

- title: Interactive App
  desc: Explore the surreal algorithm interactively
  contents:
  - surreal_app

- title: Datasets
  desc: Built-in datasets for demos and examples
  contents:
  - r_logo_image_data
  - jackolantern_surreal_data
